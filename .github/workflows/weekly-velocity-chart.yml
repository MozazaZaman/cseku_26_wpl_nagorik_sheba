name: Weekly Velocity Chart

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 6am UTC — adjust as you like

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Run velocity chart script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/plot_weekly_velocity.py

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-velocity-pie
          path: weekly-velocity-pie.png
