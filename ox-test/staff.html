<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্টাফ ড্যাশবোর্ড — নাগরিক সেবা</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#17402F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/public.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body data-lang="bn">

<header class="pub-top">
  <div class="bar">
    <span class="pub-logo">ন</span>
    <span class="pub-name" id="sdTitle">Staff</span>
    <span id="sdType" class="type-chip"></span>
    <span class="sp"></span>
    <span class="lang-seg pub-lang"><button data-plang="bn">বাংলা</button><button data-plang="en">EN</button></span>
    <button class="btn-cream" id="sdLogout" data-i18n="common.logout">লগআউট</button>
  </div>
</header>

<main class="sd-wrap">
  <div class="sd-left">
    <div class="chiprow" id="sdChips"></div>
    <div class="sd-stats" id="sdStats"></div>
    <div class="sd-policy" id="sdPolicy"></div>
    <div class="fac-list" id="sdQueue"></div>
  </div>
  <aside class="sd-right" id="sdDetail"></aside>
</main>

<div id="toast" class="toast"></div>
<script src="js/i18n.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/staffdash.js" defer></script>
</body>
</html>
